name: Build IRIS Windows Release-like

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Build iris-gui (Release, premiere + bundled + wgpu)
        env:
          LIBCHDMAN_FORCE_SOURCE: "1"
        run: cargo build -p iris-gui --release --features premiere,bundled,wgpu

      - name: Build iris CLI (Release, lightning + gpujit + wgpu)
        env:
          LIBCHDMAN_FORCE_SOURCE: "1"
        run: cargo build --release --features lightning,gpujit,wgpu

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: iris-windows-gui-and-cli
          path: |
            target/release/iris-gui.exe
            target/release/iris.exe
            target/release/*.dll
